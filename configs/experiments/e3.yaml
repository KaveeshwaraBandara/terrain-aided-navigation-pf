description: >
  E3 — particle filter design on the rugged hill-country region at sigma0 = 1000 m:
  particle count, resampling scheme, ESS threshold and roughening.
runs: 100
regions: [hill_country]
set:
  init.position_sigma: 1000
quick: {runs: 3}
studies:
  n_sweep:
    filters:
      pf_500: {family: particle_filter, set: {particle_filter.n_particles: 500}}
      pf_1000: {family: particle_filter, set: {particle_filter.n_particles: 1000}}
      pf_2000: {family: particle_filter, set: {particle_filter.n_particles: 2000}}
      pf_5000: {family: particle_filter, set: {particle_filter.n_particles: 5000}}
      pf_10000: {family: particle_filter, set: {particle_filter.n_particles: 10000}}
      pf_20000: {family: particle_filter, set: {particle_filter.n_particles: 20000}}
      pf_50000: {family: particle_filter, set: {particle_filter.n_particles: 50000}}
  resampling:
    filters:
      pf_1000: {family: particle_filter, set: {particle_filter.n_particles: 1000}}
      pf_5000: {family: particle_filter, set: {particle_filter.n_particles: 5000}}
    grid:
      particle_filter.resampling: [multinomial, systematic, stratified, residual]
  ess_threshold:
    filters:
      pf_5000: {family: particle_filter, set: {particle_filter.n_particles: 5000}}
    grid:
      particle_filter.ess_threshold: [0.1, 0.3, 0.5, 0.7, 1.0]
  roughening:
    filters:
      pf_5000: {family: particle_filter, set: {particle_filter.n_particles: 5000}}
    grid:
      particle_filter.roughening: [0.0, 0.05, 0.1, 0.2]
